name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: |
          python -m pip install --requirement requirements.txt
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Run regression and static checks
        run: |
          python -m unittest discover -v
          python -m py_compile scripts/build_skills.py scripts/validate_generated.py
          shellcheck install.sh
          find skills -type f -name '*.sh' -print0 | xargs -0 shellcheck
          python -m json.tool skills/manifest.json >/dev/null
          python scripts/validate_generated.py skills
      - name: Rebuild both host distributions from the pinned source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          source_revision=$(python -c 'import json; print(json.load(open("skills/manifest.json"))["source_revision"])')
          # Anonymous clones from shared runners are intermittently rate-limited (HTTP 429).
          # Authenticate every network step and retry with a growing delay. The blobless
          # clone fetches file contents during checkout, so checkout needs the header too.
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::${auth}"
          header="http.extraheader=AUTHORIZATION: basic ${auth}"
          for attempt in 1 2 3 4 5; do
            rm -rf upstream-plugins
            if git -c "$header" clone --filter=blob:none https://github.com/cursor/plugins.git upstream-plugins \
              && git -c "$header" -C upstream-plugins checkout "$source_revision"; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "could not fetch cursor/plugins at $source_revision after $attempt attempts" >&2
              exit 1
            fi
            sleep $((attempt * 20))
          done
          python scripts/build_skills.py --source upstream-plugins --output regenerated-skills \
            --marketplace regenerated-marketplace.json
          python scripts/validate_generated.py regenerated-skills \
            --marketplace regenerated-marketplace.json
          diff -qr skills regenerated-skills
          diff -q .agents/plugins/marketplace.json regenerated-marketplace.json
